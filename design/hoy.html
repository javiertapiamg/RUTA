<title>RUTA · Hoy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: luz iridiscente; rueda fija que respira, con eje de escala propio y zoom por área. */
:root{
  --bg:#F3F4F7;
  --fg:#13151B;
  --fg-dim:#596073;
  --fg-faint:#949BAC;
  --glass:rgba(255,255,255,.62);
  --glass-2:rgba(255,255,255,.34);
  --hair:rgba(255,255,255,.9);
  --edge:rgba(120,130,160,.16);
  --shade:rgba(20,22,28,.06);
  --shadow:0 20px 56px -22px rgba(30,36,60,.28);
  --guide:rgba(255,255,255,.95);
  --guide-op:.75;
  --empty-op:.055;
  --wheel-bed:rgba(255,255,255,0);
  --bar-a:#FFFFFF; --bar-b:#D6DAE4;

  --i1:#FFD4E6; --i2:#CDE7FF; --i3:#D4F7E8; --i4:#FFEFD2; --i5:#E4D8FF;

  --c-oficio:#36C2AE;
  --c-proyectos:#4C9BEA;
  --c-aprendizaje:#7B84F0;
  --c-plata:#E8B54C;
  --c-cuerpo:#F0867A;
  --c-perros:#9BCE5E;
  --c-vinculos:#B583E6;
  --c-presto:#F2A05A;

  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1017;--fg:#EEF0F6;--fg-dim:#A2AABD;--fg-faint:#767E92;
    --glass:rgba(255,255,255,.08);--glass-2:rgba(255,255,255,.04);
    --hair:rgba(255,255,255,.18);--edge:rgba(255,255,255,.09);--shade:rgba(0,0,0,.34);
    --shadow:0 24px 64px -22px rgba(0,0,0,.8);
    --guide:rgba(255,255,255,.55);--guide-op:.22;--empty-op:.03;
    --wheel-bed:rgba(150,185,255,.08);
    --bar-a:#2A2F3C; --bar-b:#161A23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1017;--fg:#EEF0F6;--fg-dim:#A2AABD;--fg-faint:#767E92;
  --glass:rgba(255,255,255,.08);--glass-2:rgba(255,255,255,.04);
  --hair:rgba(255,255,255,.18);--edge:rgba(255,255,255,.09);--shade:rgba(0,0,0,.34);
  --shadow:0 24px 64px -22px rgba(0,0,0,.8);
  --guide:rgba(255,255,255,.55);--guide-op:.22;--empty-op:.03;
  --wheel-bed:rgba(150,185,255,.08);
  --bar-a:#2A2F3C; --bar-b:#161A23;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.012em;overflow-x:hidden}

/* ── campo de luz ─────────────────────── */
.field{position:fixed;inset:-20vh -14vw;z-index:-2;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.b1{width:70vw;height:70vw;background:var(--i1);top:-16%;left:-18%}
.b2{width:60vw;height:60vw;background:var(--i2);top:8%;right:-22%}
.b3{width:66vw;height:66vw;background:var(--i3);bottom:2%;left:-16%}
.b4{width:52vw;height:52vw;background:var(--i4);bottom:-16%;right:-10%}
.b5{width:44vw;height:44vw;background:var(--i5);top:44%;left:30%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blob{opacity:.26;filter:blur(110px)}}
:root[data-theme="dark"] .blob{opacity:.26;filter:blur(110px)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(3vw,-4vh,0) scale(1.1)}100%{transform:translate3d(-2vw,3vh,0) scale(.95)}}
.b1{animation:drift 28s ease-in-out infinite alternate}
.b2{animation:drift 34s ease-in-out infinite alternate-reverse}
.b3{animation:drift 31s ease-in-out infinite alternate}
.b4{animation:drift 37s ease-in-out infinite alternate-reverse}
.b5{animation:drift 25s ease-in-out infinite alternate}

/* ── vidrio glossy ────────────────────── */
.glass{position:relative;border-radius:28px;
  background:linear-gradient(177deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 26%),
    linear-gradient(152deg,var(--glass),var(--glass-2));
  backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hair),inset 0 -1px 0 var(--edge)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.1px;
  background:conic-gradient(from 140deg,rgba(255,212,230,.95),rgba(205,231,255,.95),
    rgba(212,247,232,.9),rgba(255,239,210,.95),rgba(228,216,255,.9),rgba(255,212,230,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;opacity:.9;pointer-events:none}

.wrap{max-width:620px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:26px calc(120px + env(safe-area-inset-bottom,0px))}

.rise{animation:rise .9s cubic-bezier(.16,.84,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.985);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}
.d1{animation-delay:.04s}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.44s}.d5{animation-delay:.56s}
@keyframes soft{0%,100%{box-shadow:0 0 0 0 rgba(140,180,240,0)}50%{box-shadow:0 0 16px -2px rgba(140,180,240,.3)}}

/* ── encabezado ───────────────────────── */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;padding:0 6px}
.mark{font-size:14px;font-weight:700;letter-spacing:.36em;margin:0;text-transform:uppercase}
.date{font-size:12.5px;color:var(--fg-faint);margin-top:5px;text-transform:capitalize;font-weight:500}
.cd{text-align:right;flex:none}
.cd b{display:block;font-size:36px;font-weight:200;line-height:.92;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.cd span{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-faint);margin-top:7px;font-weight:600}

.quote{padding:23px 24px 21px;margin-bottom:16px}
.quote p{margin:0;font-size:20.5px;font-weight:300;line-height:1.36;letter-spacing:-.024em;text-wrap:balance}
.quote cite{display:block;margin-top:11px;font-size:10.5px;font-style:normal;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-faint);font-weight:700}

/* ── rueda ────────────────────────────── */
.wheel-card{padding:18px 14px 16px;margin-bottom:16px;overflow:hidden}
.wheel-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 2px;gap:10px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--fg-faint)}
.sample{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint);
  border:1px solid var(--edge);border-radius:999px;padding:4px 9px;background:rgba(255,255,255,.3);
  animation:soft 6.5s ease-in-out infinite}

.wheel-wrap{position:relative;width:100%;aspect-ratio:1;max-width:430px;margin:2px auto 0;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage{position:absolute;inset:0;transition:transform .8s cubic-bezier(.22,.9,.26,1);will-change:transform}
.bed{position:absolute;left:50%;top:50%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,var(--wheel-bed),transparent 70%);filter:blur(18px);pointer-events:none}
.aura{position:absolute;left:50%;top:50%;width:88%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,#FFD4E6,#CDE7FF,#D4F7E8,#FFEFD2,#E4D8FF,#FFD4E6);
  animation:spin 46s linear infinite,auraPulse 7s ease-in-out infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes auraPulse{0%,100%{opacity:.4;filter:blur(28px)}50%{opacity:.72;filter:blur(46px)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aura{animation:spin 46s linear infinite,auraD 7s ease-in-out infinite}}
:root[data-theme="dark"] .aura{animation:spin 46s linear infinite,auraD 7s ease-in-out infinite}
@keyframes auraD{0%,100%{opacity:.3;filter:blur(34px)}50%{opacity:.52;filter:blur(52px)}}

.sheen{position:absolute;left:50%;top:50%;width:74%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;mix-blend-mode:overlay;animation:spin 12s linear infinite;
  background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.7) 32deg,
    rgba(255,255,255,0) 96deg,rgba(255,255,255,0) 360deg);
  -webkit-mask:radial-gradient(circle,transparent 29%,#000 33%,#000 97%,transparent 100%);
  mask:radial-gradient(circle,transparent 29%,#000 33%,#000 97%,transparent 100%)}

.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;
  box-shadow:0 0 7px rgba(255,255,255,.95),0 0 15px rgba(200,225,255,.65);opacity:0;
  animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  50%{opacity:.95;transform:translate(-50%,-50%) scale(1.3)}}

svg.wheel{position:absolute;inset:14%;width:72%;height:72%;overflow:visible}
svg.wheel .ring{transition:fill-opacity .5s cubic-bezier(.2,.8,.3,1),fill .5s}
@keyframes bloom{from{opacity:0}to{opacity:1}}
.sector{animation:glow var(--gd,7s) ease-in-out infinite;animation-delay:var(--gdl,0s);cursor:pointer}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px var(--gc))}50%{filter:drop-shadow(0 0 13px var(--gc))}}
.sector.hot{animation-name:glow-hot;animation-duration:1.9s}
@keyframes glow-hot{0%,100%{filter:drop-shadow(0 0 10px var(--gc))}50%{filter:drop-shadow(0 0 26px var(--gc))}}
.sector.dim{opacity:.2;transition:opacity .5s}

.lbl{position:absolute;pointer-events:auto;cursor:pointer;max-width:88px;transition:opacity .4s;opacity:.78}
.lbl .in{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-dim);line-height:1.3;transition:color .3s}
.lbl.left .in{flex-direction:row-reverse;text-align:right}
.lbl i{width:7px;height:7px;border-radius:50%;flex:none;display:block;
  animation:dotGlow var(--dd,5s) ease-in-out infinite;animation-delay:var(--ddl,0s)}
@keyframes dotGlow{0%,100%{box-shadow:0 0 3px 0 currentColor;transform:scale(.88)}
  50%{box-shadow:0 0 12px 2px currentColor;transform:scale(1.14)}}
.lbl.hot{opacity:1}
.lbl.hot .in{color:var(--fg)}
.lbl.gone{opacity:0;pointer-events:none}

.readout{text-align:center;padding:13px 10px 2px;min-height:64px}
.readout .ttl{font-size:15px;font-weight:600;letter-spacing:-.015em}
.readout .txt{font-size:12.5px;color:var(--fg-dim);margin-top:4px;line-height:1.45;text-wrap:balance}
.readout .hint{font-size:11.5px;color:var(--fg-faint)}
.back{margin-top:9px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--fg-dim);background:rgba(255,255,255,.35);border:1px solid var(--edge);border-radius:999px;
  padding:7px 16px;cursor:pointer;font-family:inherit;animation:soft 4s ease-in-out infinite}

/* ── hábitos ──────────────────────────── */
.card{padding:20px;margin-bottom:16px}
.card h2{font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--fg-faint);margin:0 0 15px}
.habits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.hab{position:relative;display:flex;align-items:center;gap:11px;min-width:0;padding:14px 13px;border-radius:18px;
  border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(236,238,243,.45));
  cursor:pointer;text-align:left;color:var(--fg);font:inherit;overflow:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.3,1),box-shadow .35s,border-color .35s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hab{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}}
:root[data-theme="dark"] .hab{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.hab::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;
  background:linear-gradient(145deg,var(--h1),var(--h2));transition:opacity .45s cubic-bezier(.2,.8,.3,1)}
.hab > *{position:relative;z-index:1}
.hab:active{transform:scale(.964)}
.hab[aria-pressed="true"]{border-color:transparent;animation:habGlow 3.4s ease-in-out infinite}
.hab[aria-pressed="true"]::after{opacity:1}
@keyframes habGlow{0%,100%{box-shadow:0 8px 20px -12px var(--h2)}50%{box-shadow:0 12px 32px -8px var(--h2)}}
.hab .box{flex:none;width:23px;height:23px;border-radius:9px;border:1.6px solid var(--fg-faint);
  display:grid;place-items:center;transition:all .3s cubic-bezier(.2,.8,.3,1);background:rgba(255,255,255,.3)}
.hab .box svg{width:12px;height:12px;opacity:0;transform:scale(.4) rotate(-20deg);transition:all .36s cubic-bezier(.2,1.6,.4,1)}
.hab[aria-pressed="true"] .box{background:#fff;border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.hab[aria-pressed="true"] .box svg{opacity:1;transform:none}
.hab[aria-pressed="true"] .txt b,.hab[aria-pressed="true"] .txt small{color:#1D2029}
.hab .txt{min-width:0}
.hab .txt b{display:block;font-weight:600;font-size:13.5px;line-height:1.25;letter-spacing:-.012em;transition:color .35s}
.hab .txt small{display:block;color:var(--fg-faint);font-size:11px;margin-top:1px;font-weight:500;transition:color .35s}

/* barras 3D que respiran */
.streak{display:flex;align-items:flex-end;gap:11px;margin-top:16px;padding-top:15px;border-top:1px solid var(--edge)}
.streak .bars{display:flex;gap:3px;flex:1;min-width:0;align-items:flex-end;height:30px}
.streak .bars i{flex:1;min-width:3px;border-radius:5px;display:block;transform-origin:bottom center;
  background:linear-gradient(180deg,var(--bar-a),var(--bar-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -3px 4px -2px rgba(10,14,30,.22),
    0 1px 2px rgba(18,22,40,.16),0 3px 6px -3px rgba(18,22,40,.2);
  animation:bar 4.6s ease-in-out infinite;animation-delay:var(--bd,0s)}
@keyframes bar{0%,100%{transform:scaleY(.94)}50%{transform:scaleY(1)}}
.streak .bars i.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -4px 6px -3px rgba(10,20,50,.4),
  0 2px 4px rgba(18,30,70,.22),0 6px 12px -6px var(--bc)}
.streak em{font-style:normal;font-size:11.5px;color:var(--fg-faint);flex:none;font-weight:600;padding-bottom:4px}

/* ── lo que viene ─────────────────────── */
.next{padding:0;overflow:hidden;margin-bottom:16px}
.next-photo{position:relative;height:180px;overflow:hidden}
.next-photo .ph{position:absolute;inset:-16% 0;will-change:transform}
.next-photo .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(243,244,247,0) 26%,rgba(243,244,247,.92) 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next-photo .veil{background:linear-gradient(180deg,rgba(14,16,23,0) 24%,rgba(14,16,23,.94) 100%)}}
:root[data-theme="dark"] .next-photo .veil{background:linear-gradient(180deg,rgba(14,16,23,0) 24%,rgba(14,16,23,.94) 100%)}
.next-photo .cap{position:absolute;left:20px;right:20px;bottom:13px}
.next-photo .cap b{display:block;font-size:19px;font-weight:600;letter-spacing:-.022em}
.next-photo .cap span{display:block;font-size:11.5px;color:var(--fg-dim);margin-top:2px;font-weight:500}
.next ul{list-style:none;margin:0;padding:6px 20px 18px}
.next li{display:flex;align-items:baseline;gap:13px;padding:10px 0;border-bottom:1px solid var(--edge)}
.next li:last-child{border-bottom:none}
.next li b{flex:none;width:44px;text-align:right;font-size:18px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.next li .u{flex:none;width:28px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-faint);font-weight:700}
.next li .w{min-width:0;font-size:14px;font-weight:600}
.next li .w small{display:block;color:var(--fg-faint);font-size:11.5px;font-weight:500;margin-top:1px}

/* ── nav ──────────────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:0 max(18px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  pointer-events:none}
.nav .pill{pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:420px;padding:7px;border-radius:999px}
.nav button{background:none;border:0;color:var(--fg-faint);font:inherit;cursor:pointer;padding:8px 2px;border-radius:999px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  transition:color .25s,background .25s,transform .25s}
.nav button svg{width:19px;height:19px}
.nav button:active{transform:scale(.92)}
.nav button[aria-current="page"]{color:var(--fg);background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,255,255,.45));
  animation:soft 5s ease-in-out infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{background:rgba(255,255,255,.12)}}
:root[data-theme="dark"] .nav button[aria-current="page"]{background:rgba(255,255,255,.12)}

.foot{text-align:center;font-size:11.5px;color:var(--fg-faint);padding:4px 0 2px;font-weight:500}
.foot button{background:none;border:0;font:inherit;color:var(--fg-dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
button:focus-visible,.hab:focus-visible,.lbl:focus-visible{outline:2px solid var(--c-proyectos);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="field" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <span class="blob b4"></span><span class="blob b5"></span>
</div>

<div class="wrap">
  <header class="rise d1">
    <div><h1 class="mark">Ruta</h1><div class="date" id="date">—</div></div>
    <div class="cd"><b id="cd">—</b><span>días para Sucre</span></div>
  </header>

  <section class="glass quote rise d1"><p id="qt">—</p><cite id="qa">—</cite></section>

  <section class="glass wheel-card rise d2">
    <div class="wheel-head"><span class="eyebrow">Tu rueda</span><span class="sample">Ejemplo</span></div>
    <div class="wheel-wrap" id="wrap">
      <div class="stage" id="stage">
        <div class="bed" aria-hidden="true"></div>
        <div class="aura" aria-hidden="true"></div>
        <svg class="wheel" id="wheel" viewBox="0 0 400 400" role="img" aria-label="Rueda de la vida, ocho áreas"></svg>
        <div class="sheen" aria-hidden="true"></div>
      </div>
    </div>
    <div class="readout" id="readout"></div>
  </section>

  <section class="glass card rise d3">
    <h2>Hábitos de hoy</h2>
    <div class="habits" id="habits"></div>
    <div class="streak"><span class="bars" id="bars"></span><em>racha de 6 días</em></div>
  </section>

  <section class="glass next rise d4">
    <div class="next-photo">
      <div class="ph" id="ph"></div><div class="veil"></div>
      <div class="cap"><b>Navidad en Sucre</b><span>Con la abuela, Isa, Otto y Pipo</span></div>
    </div>
    <ul>
      <li><b id="n1">—</b><span class="u">días</span><span class="w">Licencia clase B<small>Municipalidad de La Florida</small></span></li>
      <li><b id="n2">—</b><span class="u">días</span><span class="w">Comprar el auto<small>Al contado</small></span></li>
      <li><b id="n3">—</b><span class="u">días</span><span class="w">Salir a Bolivia<small>Por tierra, con los perros</small></span></li>
    </ul>
  </section>

  <p class="foot rise d5">Dirección visual · <button type="button" id="theme">modo oscuro</button></p>
</div>

<script>
(function(){
"use strict";

const AREAS=[
  {k:"oficio",     n:"Oficio",      c:"--c-oficio",     s:7, w:"Cerraste NUVA y marcaste 5 de 7 bloques."},
  {k:"proyectos",  n:"Proyectos",   c:"--c-proyectos",  s:5, w:"El canal avanzó 2 días de 5 esta semana."},
  {k:"aprendizaje",n:"Aprendizaje", c:"--c-aprendizaje",s:4, w:"3 días sin los 15 minutos."},
  {k:"plata",      n:"Plata",       c:"--c-plata",      s:6, w:"El fondo del auto subió un 8% este mes."},
  {k:"cuerpo",     n:"Cuerpo",      c:"--c-cuerpo",     s:5, w:"Ejercicio 2 de 5 noches. Dormiste mejor."},
  {k:"perros",     n:"Otto y Pipo", c:"--c-perros",     s:9, w:"Paseo largo todos los días. Lo más firme que tienes."},
  {k:"vinculos",   n:"Vínculos",    c:"--c-vinculos",   s:7, w:"Hablaste con tu abuela. Faltan 51 días para verla."},
  {k:"presto",     n:"Presto",      c:"--c-presto",     s:6, w:"Sin movimiento, pero el viaje está en calendario."}
];
const HABITS=[
  {k:"paseo",    n:"Paseo largo", t:"12:30",  on:true,  a:"#FFB36B",b:"#F58634"},
  {k:"bloque",   n:"Bloque canal",t:"1 hora", on:true,  a:"#FF9E7A",b:"#F26A4B"},
  {k:"formacion",n:"Formación",   t:"15 min", on:false, a:"#FFDE7A",b:"#F2BC27"},
  {k:"ejercicio",n:"Ejercicio",   t:"noche",  on:false, a:"#9ADCFF",b:"#3FA9E8"}
];
const QUOTES=[
  ["La paciencia es amarga, pero su fruto es dulce.","Aristóteles"],
  ["No cuentes los días, haz que los días cuenten.","Muhammad Ali"],
  ["Un viaje de mil millas comienza con un solo paso.","Lao Tse"],
  ["Nada pesado se construye rápido.","el método"]
];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const N=new Date();
const cvar=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const daysTo=(y,m,d)=>Math.max(0,Math.round((new Date(y,m-1,d)-new Date(N.getFullYear(),N.getMonth(),N.getDate()))/864e5));
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

document.getElementById("date").textContent=DIAS[N.getDay()]+", "+N.getDate()+" de "+MESES[N.getMonth()];
const q=QUOTES[N.getDate()%QUOTES.length];
document.getElementById("qt").textContent=q[0];
document.getElementById("qa").textContent="— "+q[1];

(function(){
  const el=document.getElementById("ph");
  el.style.background="linear-gradient(180deg,#FCDCAC 0%,#F4AC7C 26%,#DA8372 46%,#9D6376 64%,#60476A 80%,#3B3053 100%)";
  el.insertAdjacentHTML("beforeend",
    '<svg viewBox="0 0 600 180" preserveAspectRatio="none" style="position:absolute;inset:auto 0 0;width:100%;height:60%">'+
    '<path d="M0 180 L0 118 L62 72 L112 104 L168 56 L224 98 L286 44 L348 92 L402 62 L470 110 L530 78 L600 116 L600 180Z" fill="#2F2847" opacity=".82"/>'+
    '<path d="M0 180 L0 146 L74 120 L140 148 L206 118 L278 150 L352 124 L430 152 L502 128 L600 150 L600 180Z" fill="#221C36" opacity=".92"/></svg>');
})();

function countTo(el,target){
  const t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/950),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);if(p<1)requestAnimationFrame(step)})(t0);
}
countTo(document.getElementById("cd"),daysTo(2026,12,25));
countTo(document.getElementById("n1"),daysTo(2026,12,5));
countTo(document.getElementById("n2"),daysTo(2026,12,10));
countTo(document.getElementById("n3"),daysTo(2026,12,19));

/* ── sonido ── */
let actx=null;
function tone(f1,f2,vol,dur,type){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(f2,t+dur*.4);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
const blip=up=>{tone(up?587:440,up?988:349,.07,.3);tone(up?1175:880,up?1975:698,.03,.26,"triangle")};
const tick=()=>tone(1560,1680,.02,.08);
const woosh=()=>tone(320,1150,.045,.35,"triangle");

/* ── geometría ── */
const CX=200,CY=200,CORE=48,R0=62,R1=178,RINGS=10,GAP=2.2,AXIS=8;
const SPAN=(360-2*AXIS)/AREAS.length;
const STEP=(R1-R0)/RINGS;
const NS="http://www.w3.org/2000/svg";
const rad=d=>(d-90)*Math.PI/180;
const pt=(r,d)=>[CX+r*Math.cos(rad(d)),CY+r*Math.sin(rad(d))];
const a0of=i=>AXIS+i*SPAN+GAP/2, a1of=i=>AXIS+(i+1)*SPAN-GAP/2, midOf=i=>AXIS+(i+.5)*SPAN;
function arc(r0,r1,a0,a1){
  const[x1,y1]=pt(r1,a0),[x2,y2]=pt(r1,a1),[x3,y3]=pt(r0,a1),[x4,y4]=pt(r0,a0);
  return`M${x1.toFixed(2)} ${y1.toFixed(2)}A${r1} ${r1} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`+
        `L${x3.toFixed(2)} ${y3.toFixed(2)}A${r0} ${r0} 0 0 0 ${x4.toFixed(2)} ${y4.toFixed(2)}Z`;
}
function openArc(r,a0,a1){
  const[x1,y1]=pt(r,a0),[x2,y2]=pt(r,a1);
  return`M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

const sv=document.getElementById("wheel"), wrap=document.getElementById("wrap"),
      stage=document.getElementById("stage"), readout=document.getElementById("readout");
let groups=[],rings=[],lblEls=[],coreG=null,coreNum=null,coreLbl=null,coreRing=null;
let hot=-1, zoom=-1, avgShown=0;

function paint(i,wave){
  const a=AREAS[i], empty=cvar("--empty-op")||".055";
  rings[i].forEach((el,idx)=>{
    const r=idx+1, on=r<=a.s;
    const apply=()=>{
      el.setAttribute("fill",on?`url(#g${i})`:"currentColor");
      el.setAttribute("fill-opacity",on?(.3+.07*r).toFixed(2):empty);
    };
    if(wave)setTimeout(apply,idx*42);else apply();
  });
}
const avgNow=()=>AREAS.reduce((x,y)=>x+y.s,0)/AREAS.length;
function setAvg(){
  if(!coreNum||hot>=0)return;
  const t=avgNow(),from=avgShown,t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/600),e=1-Math.pow(1-p,3);
    coreNum.textContent=(from+(t-from)*e).toFixed(1);
    if(p<1)requestAnimationFrame(step);else avgShown=t;
  })(t0);
}

function build(){
  sv.innerHTML="";
  const defs=document.createElementNS(NS,"defs");
  defs.innerHTML=AREAS.map((a,i)=>{
    const c=cvar(a.c);
    return `<linearGradient id="g${i}" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="${c}" stop-opacity=".42"/>
      <stop offset="1" stop-color="${c}" stop-opacity=".97"/></linearGradient>`;
  }).join("")+
  `<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>`;
  sv.appendChild(defs);

  groups=[];rings=[];
  const guide=cvar("--guide"), gop=cvar("--guide-op");
  AREAS.forEach((a,i)=>{
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","sector");g.dataset.i=i;
    g.style.setProperty("--gc",cvar(a.c)+"99");
    g.style.setProperty("--gd",(5.6+i*0.49).toFixed(1)+"s");
    g.style.setProperty("--gdl",(-i*0.97).toFixed(1)+"s");
    const a0=a0of(i), a1=a1of(i);
    let h="";
    for(let r=1;r<=RINGS;r++){
      h+=`<path class="ring" d="${arc(R0+(r-1)*STEP+1.4,R0+r*STEP,a0,a1)}"
        data-i="${i}" data-r="${r}" style="animation:bloom .7s ease-out ${(.3+r*.04+i*.035).toFixed(2)}s both">
        <title>${a.n} — ${r}</title></path>`;
    }
    /* guías propias del sector: así se ve dónde termina */
    for(let r=1;r<=RINGS;r++){
      h+=`<path d="${openArc(R0+r*STEP,a0,a1)}" fill="none" stroke="${guide}" stroke-width=".7"
        opacity="${gop}" pointer-events="none"/>`;
    }
    const[lx1,ly1]=pt(R0,a0),[lx2,ly2]=pt(R1,a0);
    const[rx1,ry1]=pt(R0,a1),[rx2,ry2]=pt(R1,a1);
    h+=`<line x1="${lx1.toFixed(1)}" y1="${ly1.toFixed(1)}" x2="${lx2.toFixed(1)}" y2="${ly2.toFixed(1)}"
        stroke="${guide}" stroke-width="1" opacity="${gop}" pointer-events="none"/>
        <line x1="${rx1.toFixed(1)}" y1="${ry1.toFixed(1)}" x2="${rx2.toFixed(1)}" y2="${ry2.toFixed(1)}"
        stroke="${guide}" stroke-width="1" opacity="${gop}" pointer-events="none"/>
        <circle cx="${lx2.toFixed(1)}" cy="${ly2.toFixed(1)}" r="2.6" fill="#fff" opacity=".85" filter="url(#soft)" pointer-events="none"/>
        <circle cx="${lx2.toFixed(1)}" cy="${ly2.toFixed(1)}" r="1.4" fill="#fff" opacity=".95" pointer-events="none"/>`;
    g.innerHTML=h;
    sv.appendChild(g);groups.push(g);
    rings.push(Array.prototype.slice.call(g.querySelectorAll(".ring")));
    paint(i,false);
  });

  /* eje de escala, en su propia calle arriba */
  const axis=document.createElementNS(NS,"g");
  axis.setAttribute("pointer-events","none");
  let ah="";
  for(let r=1;r<=RINGS;r++){
    const y=CY-(R0+(r-.5)*STEP);
    ah+=`<text x="${CX}" y="${(y+2.6).toFixed(1)}" text-anchor="middle" font-size="7.6" font-weight="600"
      fill="${cvar("--fg-faint")}" font-family="${cvar("--ui")}" opacity=".95">${r}</text>`;
  }
  axis.innerHTML=ah;sv.appendChild(axis);

  /* núcleo */
  coreG=document.createElementNS(NS,"g");
  coreG.style.cursor="pointer";
  const avg=avgNow().toFixed(1);
  coreG.innerHTML=
    `<ellipse cx="${CX}" cy="${CY+CORE*.8}" rx="${CORE*.88}" ry="${CORE*.22}" fill="rgba(16,20,36,.28)" filter="url(#soft)"/>
     <circle id="cring" cx="${CX}" cy="${CY}" r="${CORE+4}" fill="none" stroke="transparent" stroke-width="1.6" opacity="0"/>
     <circle cx="${CX}" cy="${CY}" r="${CORE}" fill="#000"/>
     <text id="cnum" x="${CX}" y="${CY+5}" text-anchor="middle" font-size="27" font-weight="200"
       letter-spacing="-1" fill="#fff" font-family="${cvar("--ui")}">${avg}</text>
     <text id="clbl" x="${CX}" y="${CY+21}" text-anchor="middle" font-size="7" font-weight="700"
       letter-spacing="2.4" fill="rgba(255,255,255,.55)" font-family="${cvar("--ui")}">EQUILIBRIO</text>`;
  sv.appendChild(coreG);
  coreNum=coreG.querySelector("#cnum");coreLbl=coreG.querySelector("#clbl");coreRing=coreG.querySelector("#cring");
  coreG.addEventListener("click",e=>{e.stopPropagation();zoom>=0?unzoom():setHot(-1)});
  sv.style.color=cvar("--fg");
  avgShown=+avg;
}

function labels(){
  wrap.querySelectorAll(".lbl").forEach(e=>e.remove());
  lblEls=[];
  AREAS.forEach((a,i)=>{
    const mid=midOf(i), right=Math.cos(rad(mid))>=0;
    const el=document.createElement("div");
    el.className="lbl "+(right?"right":"left");
    el.style.left=(50+Math.cos(rad(mid))*41)+"%";
    el.style.top=(50+Math.sin(rad(mid))*41)+"%";
    el.style.transform=right?"translate(0,-50%)":"translate(-100%,-50%)";
    el.dataset.i=i;
    el.innerHTML=`<div class="in"><i style="background:${cvar(a.c)};color:${cvar(a.c)};
      --dd:${(4.2+i*0.33).toFixed(1)}s;--ddl:${(-i*0.7).toFixed(1)}s"></i><b>${a.n}</b></div>`;
    el.addEventListener("click",ev=>{ev.stopPropagation();zoom===i?unzoom():zoomTo(i)});
    el.addEventListener("pointerenter",()=>{if(zoom<0)setHot(i)});
    wrap.appendChild(el);lblEls.push(el);
  });
}

function sparks(){
  stage.querySelectorAll(".spark").forEach(e=>e.remove());
  for(let i=0;i<16;i++){
    const ang=Math.random()*360, rr=33+Math.random()*20;
    const s=document.createElement("span");
    s.className="spark";
    s.style.left=(50+Math.cos(rad(ang))*rr)+"%";
    s.style.top=(50+Math.sin(rad(ang))*rr)+"%";
    s.style.animationDelay=(-Math.random()*6).toFixed(2)+"s";
    s.style.animationDuration=(4.5+Math.random()*4).toFixed(1)+"s";
    const sz=(1.6+Math.random()*2.6).toFixed(1)+"px";
    s.style.width=sz;s.style.height=sz;
    stage.appendChild(s);
  }
}

/* ── respiración ── */
const phase=AREAS.map((_,i)=>i*0.83+Math.random()*0.5);
const lift=AREAS.map(()=>0);
let wrapW=430;
const measure=()=>{wrapW=wrap.clientWidth||430};
measure();addEventListener("resize",measure);

function loop(t){
  const s=t/1000;
  const f=0.72*wrapW/400;
  groups.forEach((g,i)=>{
    const target=(hot===i?1:0);
    lift[i]+=(target-lift[i])*0.11;
    const breath=Math.sin(s*0.55+phase[i])*7.2;
    const swirl=Math.sin(s*0.33+phase[i]*1.6)*1.5;
    const sc=1+Math.sin(s*0.48+phase[i]*0.8)*0.022+lift[i]*0.04;
    const out=breath+lift[i]*14;
    const mid=rad(midOf(i));
    const dx=Math.cos(mid)*out, dy=Math.sin(mid)*out;
    g.setAttribute("transform",
      `translate(${dx.toFixed(2)} ${dy.toFixed(2)}) rotate(${swirl.toFixed(2)} ${CX} ${CY}) `+
      `translate(${CX} ${CY}) scale(${sc.toFixed(4)}) translate(${-CX} ${-CY})`);
    const el=lblEls[i];
    if(el)el.firstElementChild.style.transform=
      `translate(${(dx*f).toFixed(1)}px,${(dy*f).toFixed(1)}px) scale(${(1+lift[i]*0.1).toFixed(3)})`;
  });
  if(coreG){
    const cs=1+Math.sin(s*0.95)*0.022+(hot>=0?0.055:0);
    coreG.setAttribute("transform",`translate(${CX} ${CY}) scale(${cs.toFixed(4)}) translate(${-CX} ${-CY})`);
  }
  requestAnimationFrame(loop);
}

/* ── lectura ── */
function renderReadout(){
  if(hot<0){
    readout.innerHTML=zoom>=0
      ? '<div class="hint">Toca el centro para volver.</div><button type="button" class="back">Volver</button>'
      : '<div class="hint">Pasa por encima para explorar. Toca un nombre para acercarte, un anillo para puntuar.</div>';
  }else{
    const a=AREAS[hot];
    readout.innerHTML=`<div class="ttl" style="color:${cvar(a.c)}">${a.n} · ${a.s}</div>`+
      `<div class="txt">${a.w}</div>`+(zoom>=0?'<button type="button" class="back">Volver</button>':'');
  }
  const bk=readout.querySelector(".back");
  if(bk)bk.addEventListener("click",unzoom);
}
function setHot(i){
  if(i===hot){renderReadout();return}
  hot=i;
  lblEls.forEach(el=>el.classList.toggle("hot",+el.dataset.i===i));
  groups.forEach((g,gi)=>g.classList.toggle("hot",gi===i));
  if(coreNum){
    if(i<0){
      coreNum.textContent=avgNow().toFixed(1);coreNum.setAttribute("fill","#fff");
      coreLbl.textContent="EQUILIBRIO";coreRing.setAttribute("opacity","0");
      avgShown=avgNow();
    }else{
      const a=AREAS[i],c=cvar(a.c);
      tick();
      coreNum.textContent=a.s;coreNum.setAttribute("fill",c);
      coreLbl.textContent=a.n.toUpperCase();
      coreRing.setAttribute("stroke",c);coreRing.setAttribute("opacity",".85");
    }
  }
  renderReadout();
}

/* ── zoom ── */
function zoomTo(i){
  zoom=i;woosh();
  const mid=rad(midOf(i));
  stage.style.transformOrigin=(50+Math.cos(mid)*26)+"% "+(50+Math.sin(mid)*26)+"%";
  stage.style.transform="scale(1.85)";
  groups.forEach((g,gi)=>g.classList.toggle("dim",gi!==i));
  lblEls.forEach(el=>el.classList.add("gone"));
  hot=-1;setHot(i);
}
function unzoom(){
  zoom=-1;woosh();
  stage.style.transform="";
  groups.forEach(g=>g.classList.remove("dim"));
  lblEls.forEach(el=>el.classList.remove("gone"));
  hot=-1;setHot(-1);
}

/* ── exploración y puntaje ── */
function sectorAt(e){
  const r=sv.getBoundingClientRect();
  const x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2);
  const dist=Math.hypot(x,y)/(r.width/2)*200;
  if(dist<CORE*0.95||dist>R1+24)return -1;
  let d=Math.atan2(y,x)*180/Math.PI+90;
  d=((d%360)+360)%360;
  if(d<AXIS||d>360-AXIS)return -1;
  return Math.min(AREAS.length-1,Math.floor((d-AXIS)/SPAN));
}
wrap.addEventListener("pointermove",e=>{if(zoom<0)setHot(sectorAt(e))});
wrap.addEventListener("pointerleave",()=>{if(zoom<0)setHot(-1)});
sv.addEventListener("click",e=>{
  const p=e.target.closest("[data-r]");if(!p)return;
  const i=+p.dataset.i, a=AREAS[i], v=+p.dataset.r;
  blip(v>a.s);
  a.s=(a.s===v?v-1:v);
  paint(i,true);
  if(coreNum&&hot===i)coreNum.textContent=a.s;
  setAvg();renderReadout();
});
sv.addEventListener("dblclick",e=>{const i=sectorAt(e);if(i>=0)zoom===i?unzoom():zoomTo(i)});

/* ── hábitos ── */
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#1D2029" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
function drawHabits(){
  const h=document.getElementById("habits");h.innerHTML="";
  HABITS.forEach((hb,idx)=>{
    const b=document.createElement("button");
    b.type="button";b.className="hab";b.setAttribute("aria-pressed",hb.on?"true":"false");
    b.style.setProperty("--h1",hb.a);b.style.setProperty("--h2",hb.b);
    b.style.animationDelay=(-idx*0.85)+"s";
    b.innerHTML=`<span class="box">${CHECK}</span><span class="txt"><b>${hb.n}</b><small>${hb.t}</small></span>`;
    b.addEventListener("click",()=>{hb.on=!hb.on;blip(hb.on);drawHabits();drawBars()});
    h.appendChild(b);
  });
}
const WEEK=[3,4,4,2,0,4,3,4,4,1,3,4,4,-1,2,4,3,4,4,2];
function drawBars(){
  const done=HABITS.filter(x=>x.on).length;
  const data=WEEK.concat([done]);
  document.getElementById("bars").innerHTML=data.map((v,i)=>{
    const d=`--bd:${(-i*0.21).toFixed(2)}s`;
    if(v<0)return `<i class="diff" style="${d};background:repeating-linear-gradient(45deg,#F2BC27,#F2BC27 3px,transparent 3px,transparent 6px);height:62%"></i>`;
    if(v===0)return `<i style="${d};height:34%"></i>`;
    const hgt=(38+v*15.5).toFixed(0);
    const col=["#9ADCFF","#7FD0F5","#5CBBEE","#3FA9E8"][Math.min(3,v-1)];
    const top=["#CFEEFF","#B4E4FD","#9ADCFF","#7FD0F5"][Math.min(3,v-1)];
    return `<i class="on" style="${d};--bc:${col}66;height:${hgt}%;background:linear-gradient(180deg,${top},${col})"></i>`;
  }).join("");
}

/* ── parallax ── */
const ph=document.getElementById("ph"),blobs=document.querySelectorAll(".blob");
let ticking=false;
addEventListener("scroll",()=>{
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{
    const y=scrollY;
    ph.style.transform=`translateY(${(y*.1).toFixed(1)}px)`;
    blobs.forEach((b,i)=>{b.style.marginTop=(-y*(0.035+i*0.013)).toFixed(1)+"px"});
    ticking=false;
  });
},{passive:true});

/* ── tema ── */
const tb=document.getElementById("theme");
tb.addEventListener("click",()=>{
  const dark=document.documentElement.getAttribute("data-theme")==="dark"||
    (!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
  tb.textContent=dark?"modo oscuro":"modo claro";
  blip(!dark);
  const z=zoom;build();labels();hot=-1;zoom=-1;
  if(z>=0)zoomTo(z);else setHot(-1);
});

build();labels();sparks();drawHabits();drawBars();setHot(-1);
if(!reduce)requestAnimationFrame(loop);
})();
</script>
